<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>Série — Uma investigação em 20 minutos</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden;
    font-family: Georgia, "Times New Roman", serif; }
  #video { width: 100vw; height: 100vh; object-fit: contain; background: #000; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px; background: #000; cursor: pointer; }
  #overlay h1 { color: #FAFAFA; font-size: clamp(28px, 4vw, 52px); font-weight: 600;
    letter-spacing: -0.015em; text-align: center; line-height: 1.15; }
  #overlay p { color: #A1A1AA; font-size: clamp(15px, 1.4vw, 20px); }
  #overlay .btn { color: #FAFAFA; background: #2563EB; border: 0; border-radius: 10px;
    padding: 18px 44px; font: 600 20px Georgia, serif; cursor: pointer; }
  #overlay .btn:hover { background: #1D4ED8; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 22px 18px;
    background: linear-gradient(transparent, rgba(0,0,0,.78));
    display: flex; align-items: center; gap: 14px; opacity: 0; transition: opacity .25s; }
  #hud.show { opacity: 1; }
  #hud .ep { color: #93C5FD; font: 600 13px system-ui, sans-serif; letter-spacing: .1em;
    text-transform: uppercase; white-space: nowrap; }
  #hud .bar { flex: 1; height: 4px; background: #3F3F46; border-radius: 2px; overflow: hidden; }
  #hud .fill { height: 100%; width: 0; background: #2563EB; }
  #hud .hint { color: #A1A1AA; font: 12px system-ui, sans-serif; white-space: nowrap; }
</style>
</head>
<body>
  <video id="video" playsinline></video>

  <div id="overlay">
    <h1>Uma investigação<br />em 20 minutos</h1>
    <p>20 episódios de ~1 minuto · ambiente de demonstração · dados fictícios</p>
    <button class="btn" id="play">▶ &nbsp;Assistir à série</button>
    <p style="font-size:13px;opacity:.7">Espaço: pausa · N/P: episódio · ←/→: 10s · F: tela cheia · Esc: sair</p>
  </div>

  <div id="hud">
    <span class="ep" id="epLabel"></span>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <span class="hint" id="hint"></span>
  </div>

<script>
  const EPS = Array.from({ length: 20 }, (_, i) =>
    `/demo/serie/ep-${String(i + 1).padStart(2, '0')}.mp4?v=4`);
  const TITLES = [
    'O que é lavagem de dinheiro', 'O sistema em um relance', 'Uma movimentação entra',
    'O motor levanta a suspeita', 'Lendo um alerta', 'A regra que a máquina executa',
    'A trilha de um fracionador', 'Quem é o cliente', 'A rede de sócios',
    'Consultando as listas', 'A trilha cripto começa', 'Mixers: onde o dinheiro se esconde',
    'Um investigado, muitas carteiras', 'Endereços sancionados', 'O caso se abre',
    'A IA propõe, o humano decide', 'Trocando o modelo', 'Bloqueio preventivo',
    'O RIF é assinado', 'O dossiê final',
  ];
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const hud = document.getElementById('hud');
  const epLabel = document.getElementById('epLabel');
  const fill = document.getElementById('fill');
  const hint = document.getElementById('hint');
  let idx = 0, hudTimer;

  function fmt(s) {
    s = Math.max(0, Math.floor(s));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }
  function load(i) {
    idx = (i + EPS.length) % EPS.length;
    video.src = EPS[idx];
    video.play().catch(() => {});
  }
  function showHud() {
    hud.classList.add('show');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => hud.classList.remove('show'), 2600);
  }

  document.getElementById('play').addEventListener('click', async () => {
    overlay.style.display = 'none';
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    load(0);
  });

  video.addEventListener('loadedmetadata', () => {
    epLabel.textContent = `EP ${String(idx + 1).padStart(2, '0')}/20 · ${TITLES[idx]}`;
  });
  video.addEventListener('timeupdate', () => {
    fill.style.width = (video.currentTime / (video.duration || 1)) * 100 + '%';
    hint.textContent = `${fmt(video.currentTime)} / ${fmt(video.duration || 0)}`;
  });
  video.addEventListener('ended', () => { if (idx < EPS.length - 1) load(idx + 1); });
  video.addEventListener('pause', showHud);
  video.addEventListener('play', showHud);

  document.addEventListener('keydown', (e) => {
    if (overlay.style.display !== 'none') return;
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
    else if (e.key.toLowerCase() === 'n') load(idx + 1);
    else if (e.key.toLowerCase() === 'p') load(idx - 1);
    else if (e.key === 'ArrowRight') video.currentTime += 10;
    else if (e.key === 'ArrowLeft') video.currentTime -= 10;
    else if (e.key.toLowerCase() === 'f') {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    }
    showHud();
  });

  let lastMove = 0;
  document.addEventListener('mousemove', () => {
    if (overlay.style.display !== 'none') return;
    document.body.style.cursor = '';
    showHud();
    lastMove = Date.now();
  });
  setInterval(() => {
    if (!video.paused && Date.now() - lastMove > 2600) document.body.style.cursor = 'none';
  }, 500);
</script>
</body>
</html>
